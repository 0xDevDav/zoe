<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Telegram's colours underneath; theme/theme.css gives Zoe's look, or the installation's own. */
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --surface: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color, #f2f2f5));
  --line: var(--tg-theme-section-separator-color, rgba(128, 128, 128, 0.2));
  --text: var(--tg-theme-text-color, #000000);
  --muted: var(--tg-theme-hint-color, #8a8a8e);
  --accent: var(--tg-theme-button-color, #2481cc);
  --on-accent: var(--tg-theme-button-text-color, #ffffff);
  --danger: var(--tg-theme-destructive-text-color, #e53935);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: var(--font);
  --radius: 16px;
}
/* Nothing in the menu can be selected or copied, apart from what is typed in a field. */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); }
body { padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 14px; margin: 0 4px 20px; }
#logo { display: none; flex: none; width: 48px; height: 48px; border-radius: 14px; }
#brand { font: 600 12px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 6px 0 0; font: 800 26px/1.15 var(--font-display); letter-spacing: -0.02em; overflow-wrap: anywhere; }
h2 { margin: 26px 4px 8px; font: 600 12px/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
p { margin: 10px 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
code { display: block; margin: 10px 4px; color: var(--muted); font: 13px/1.4 ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
.list, .quote { margin: 12px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row small { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; }
.row.go::after { content: "›"; color: var(--muted); font-size: 24px; line-height: 1; }
.count { flex: none; min-width: 24px; padding: 0 8px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font: 700 13px/24px var(--font-display); text-align: center; }
button.row:active { background: var(--line); }
.stats { display: grid; gap: 10px; margin: 12px 0; }
.cols-1 { grid-template-columns: 1fr; }
.cols-2 { grid-template-columns: 1fr 1fr; }
.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.stat { min-width: 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.stat.wide { grid-column: 1 / -1; }
.stat small { display: block; color: var(--muted); font: 600 11px/1.2 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; }
.stat strong { display: block; margin-top: 8px; font: 800 24px/1.15 var(--font-display); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.stat.accent { border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.stat.accent strong { color: var(--accent); }
.stat.danger { border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.stat.danger strong { color: var(--danger); }
.quote { padding: 14px 16px; }
.meters { margin: 12px 0; padding: 4px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.meter { padding: 14px 0; }
.meter + .meter { border-top: 1px solid var(--line); }
.meter .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.meter .top span { min-width: 0; font: 600 15px/1.3 var(--font-display); overflow-wrap: anywhere; }
.meter .top strong { flex: none; font: 800 20px/1.2 var(--font-display); letter-spacing: -0.02em; }
.meter .bar { height: 8px; margin-top: 10px; border-radius: 4px; background: color-mix(in srgb, var(--text) 12%, transparent); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.meter small { display: block; margin-top: 8px; color: var(--muted); font-size: 13px; }
button.meter { display: block; width: 100%; border: 0; border-radius: 0; background: none; color: inherit; font: inherit; text-align: left; }
.meter.go .top span::after { content: " ›"; color: var(--muted); }
.meter.danger .top strong { color: var(--danger); }
.meter.danger .bar i { background: var(--danger); }
.quote summary { color: var(--muted); list-style: none; overflow-wrap: anywhere; }
summary::-webkit-details-marker { display: none; }
.quote[open] summary { display: none; }
.quote div { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.section { margin: 10px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.section[open] { border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.section > summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px; list-style: none; }
.section > summary span { flex: 1; min-width: 0; font: 700 17px/1.3 var(--font-display); overflow-wrap: anywhere; }
.section > summary small { display: block; margin-top: 2px; color: var(--muted); font: 400 14px/1.4 var(--font); }
.section > summary::after { content: "›"; color: var(--muted); font-size: 24px; line-height: 1; transform: rotate(90deg); transition: transform 0.2s; }
.section[open] > summary::after { transform: rotate(-90deg); }
.section .inner { padding: 0 16px 16px; }
.section .list { margin-top: 0; background: var(--bg); }
.side { flex: none; color: var(--danger); font: 600 14px/1 var(--font-display); }
.add { display: flex; gap: 8px; margin: 12px 0 0; }
.add input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); font: inherit; }
.add input::placeholder { color: var(--muted); }
.add .button { width: auto; margin: 0; padding: 12px 18px; }
.button { display: block; width: 100%; margin: 12px 0 0; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font: 600 16px/1.2 var(--font-display); }
.button.success { border-color: transparent; background: var(--accent); color: var(--on-accent); }
.button.danger { color: var(--danger); }
.button:active { transform: scale(0.98); }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); padding: 12px 16px; border-radius: 12px; background: var(--text); color: var(--bg); text-align: center; font-size: 15px; }
#toast[hidden] { display: none; }
</style>
<link rel="stylesheet" href="theme/theme.css">
<script src="menu.js" defer></script>
</head>
<body>
<header>
  <div id="logo"></div>
  <div><div id="brand"></div><h1 id="title"></h1></div>
</header>
<main id="view"></main>
<div id="toast" hidden></div>
</body>
</html>
